name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        run: npm test

      - name: Confirm the extension loads in pi
        run: |
          # The version banner prints before initialisation finishes, so it only proves
          # the factory started. This wrapper reports after the factory resolves.
          cat > /tmp/ready-probe.ts <<'PROBE'
          import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";

          export default async function (pi: ExtensionAPI) {
          	const extension = await import(`${process.env.GITHUB_WORKSPACE}/extensions/switchboard/index.ts`);
          	await extension.default(pi);
          	console.error("EXTENSION_READY");
          }
          PROBE
          npx pi --no-extensions --extension /tmp/ready-probe.ts --list-models 2> >(tee /tmp/pi-stderr.txt >&2)
          if ! grep -q "EXTENSION_READY" /tmp/pi-stderr.txt; then
            echo "::error::the extension did not finish initialising"
            exit 1
          fi
